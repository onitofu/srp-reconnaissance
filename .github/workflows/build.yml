name: Build and Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21 for Checkstyle
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Preserve Checkstyle Java installation
        run: echo "CHECKSTYLE_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 8 for Forge
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Prepare Forge workspace
        run: ./gradlew --no-daemon --console=plain setupDecompWorkspace

      - name: Check and build
        run: ./gradlew --no-daemon --console=plain clean build

      - name: Upload verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload addon and sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: srp-reconnaissance
          path: build/libs/srp-reconnaissance-*.jar
          retention-days: 14
          if-no-files-found: error
